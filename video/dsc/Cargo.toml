[package]
name = "gst-plugin-dsc"
version = "0.1.0"
authors = ["Diego Nieto <dnieto@fluendo.com>"]
edition = "2021"
description = "GStreamer Digital Content Signing plugin"
repository = "https://gitlab.freedesktop.org/gstreamer/gst-plugins-rs"
license = "MPL-2.0"

[dependencies]
hound = "3"
anyhow = "1"
glib.workspace = true
gst = { workspace = true, features = ["v1_20"] }
gst-base = { workspace = true, features = ["v1_20"] }
gst-video = { workspace = true, features = ["v1_20"] }
human_bytes = { version = "0.4", default-features = false }
atomic_refcell = "0.1"
gst-plugin-originalbuffer = { git = "https://gitlab.freedesktop.org/gstreamer/gst-plugins-rs", tag = "0.13.0" }

openssl = "0.10"
rsa = "0.9"
rand = "0.9.2"
sha2 = "0.10"
base64ct = "1.7.0"
once_cell = "1"
hex = "0.4"

[lib]
name = "gstdsc"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
gst-plugin-version-helper = {  git = "https://gitlab.freedesktop.org/gstreamer/gst-plugins-rs" }

[features]
capi = []
static = []
doc = ["gst/v1_16"]

[dev-dependencies]
gst-check = { workspace = true, features = ["v1_20"] }